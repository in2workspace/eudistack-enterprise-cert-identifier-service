name: License Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-gate:
    name: License Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate CycloneDX SBOM
        run: npm run sbom

      - name: Run License Gate
        uses: in2workspace/eudistack-platform-dev/.github/actions/license-gate@license-gate-v1.0.0
        with:
          sbom-path: build/sbom/sbom.json
          policy-path: .github/license-policy.json
          exceptions-path: .github/license-exceptions.json
